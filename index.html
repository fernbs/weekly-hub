<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>La Guía Ferlín</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <meta name="theme-color" content="#0e1116">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ferlín">
  <meta http-equiv="Cache-Control" content="no-cache">
  <!-- iOS Splash Screens — one per iPhone model -->
  <link rel="apple-touch-startup-image" media="screen and (device-width:320px) and (device-height:568px) and (-webkit-device-pixel-ratio:2)" href="splash/splash-640x1136.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)" href="splash/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:414px) and (device-height:736px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1242x2208.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1242x2688.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)" href="splash/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)" href="splash/splash-1290x2796.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ══ DESIGN SYSTEM — one cohesive dark shell ══════════════ */
    :root {
      --bg:#0e1116; --surface:#161a21; --surface-2:#1d232c; --line:#2a313d;
      --txt:#e8ebf0; --dim:#9aa5b4; --mute:#5c6672;
      --sky:#38bdf8; --violet:#a78bfa; --red:#f87171; --amber:#fbbf24; --green:#34d399;
      --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.35);
      --accent:var(--sky); /* overridden per tab */
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-text-size-adjust:100%; }
    body {
      font-family:'Barlow',system-ui,sans-serif; background:var(--bg); color:var(--txt);
      min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; }
    img { max-width:100%; }

    /* Tab accent theming */
    body[data-tab="news"]     { --accent:var(--sky); }
    body[data-tab="plans"]    { --accent:var(--violet); }
    body[data-tab="concerts"] { --accent:var(--red); }

    /* ══ HEADER ══════════════════════════════════ */
    .hdr {
      position:sticky; top:0; z-index:100; background:rgba(14,17,22,.92);
      backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      padding-top:env(safe-area-inset-top,0px);
    }
    .hdr-top { display:flex; align-items:center; justify-content:center; gap:10px; padding:13px 20px 2px; }
    .wordmark { font-family:'Bebas Neue',sans-serif; font-size:25px; letter-spacing:2.5px; color:var(--accent); line-height:1; transition:color .25s; }
    .updated { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--mute); }
    .tabs { display:flex; justify-content:center; gap:4px; padding:8px 8px 0; }
    .tab {
      appearance:none; border:0; background:transparent; cursor:pointer;
      font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px;
      letter-spacing:1.5px; text-transform:uppercase; color:var(--mute);
      padding:8px 14px 11px; border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
      display:flex; align-items:center; gap:6px;
    }
    .tab:hover { color:var(--dim); }
    .tab.active { color:var(--txt); border-bottom-color:var(--accent); }
    .tab .cnt { font-family:'JetBrains Mono',monospace; font-size:9px; padding:1px 6px; border-radius:20px; background:var(--surface-2); color:var(--dim); }
    .tab.active .cnt { background:var(--accent); color:#0e1116; }

    /* ══ PANELS + SHARED ══════════════════════════ */
    .panel { display:none; }
    .panel.active { display:block; animation:fade .25s ease; }
    @keyframes fade { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:none;} }
    .wrap { max-width:720px; margin:0 auto; padding:20px 15px calc(90px + env(safe-area-inset-bottom,0px)); }
    .wrap-wide { max-width:1080px; }

    .lead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; gap:12px; }
    .lead h1 { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; letter-spacing:.5px; color:var(--txt); }
    .lead .sub { font-size:12px; color:var(--dim); }
    .lead .tag { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--mute); white-space:nowrap; }

    .state { text-align:center; padding:70px 20px; color:var(--mute); }
    .state .ic { font-size:34px; margin-bottom:12px; opacity:.8; }
    .state .t { font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); }
    .state .s { font-size:12px; margin-top:5px; }

    .badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; letter-spacing:.4px; }
    .badge-lang { color:#0e1116; }
    .badge-es { background:var(--red); color:#0e1116; }
    .badge-en { background:var(--sky); color:#0e1116; }

    /* ══ NEWS ══════════════════════════════════════ */
    .filters { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; }
    .chip {
      appearance:none; border:1px solid var(--line); background:var(--surface); cursor:pointer;
      color:var(--dim); font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:12px;
      letter-spacing:.5px; text-transform:uppercase; padding:5px 12px; border-radius:20px; transition:all .15s;
    }
    .chip:hover { color:var(--txt); border-color:var(--mute); }
    .chip.on { background:var(--sky); border-color:var(--sky); color:#0e1116; }

    .cards { display:flex; flex-direction:column; gap:15px; }
    .ncard {
      background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
      overflow:hidden; transition:border-color .15s, transform .15s;
    }
    .ncard:hover { border-color:var(--mute); }
    .ncard-img { width:100%; height:190px; object-fit:cover; display:block; border-bottom:1px solid var(--line); background:var(--surface-2); }
    .ncard-body { padding:16px 18px 17px; }
    .ncard-meta { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
    .topic { font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--sky); background:rgba(56,189,248,.12); padding:2px 8px; border-radius:5px; }
    .src { font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; letter-spacing:.8px; text-transform:uppercase; color:var(--mute); }
    .ncard-title {
      font-family:'Libre Baskerville',Georgia,serif; font-size:18px; font-weight:700; line-height:1.4;
      color:var(--txt); text-decoration:none; display:block; margin-bottom:13px;
    }
    .ncard-title:hover { color:var(--sky); }
    .sec { margin-bottom:12px; }
    .sec-lbl { font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--sky); margin-bottom:3px; }
    .sec p { color:var(--dim); font-size:14.5px; line-height:1.6; }
    .datos { list-style:none; }
    .datos li { position:relative; padding:3px 0 3px 18px; color:var(--dim); font-size:14px; line-height:1.55; }
    .datos li::before { content:''; position:absolute; left:2px; top:11px; width:5px; height:5px; border-radius:50%; background:var(--sky); }
    .concl { background:var(--surface-2); border-left:3px solid var(--sky); border-radius:0 8px 8px 0; padding:9px 13px; }
    .concl .sec-lbl { color:var(--amber); }
    .concl p { color:var(--txt); font-size:13.5px; line-height:1.55; }
    .ncard-link { display:inline-block; margin-top:13px; font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:13px; letter-spacing:.8px; text-transform:uppercase; color:var(--sky); text-decoration:none; }
    .ncard-link:hover { text-decoration:underline; }

    /* ══ PLANS ══════════════════════════════════════ */
    .subtabs { display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px; }
    .subtab {
      appearance:none; border:1px solid var(--line); background:var(--surface); cursor:pointer; white-space:nowrap;
      font-family:'Barlow Condensed',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.8px;
      text-transform:uppercase; color:var(--dim); padding:7px 14px; border-radius:20px; transition:all .15s;
      display:flex; align-items:center; gap:6px;
    }
    .subtab .c { font-family:'JetBrains Mono',monospace; font-size:9px; padding:1px 5px; border-radius:10px; background:var(--surface-2); }
    .subtab[data-s="new"].on { background:var(--green); border-color:var(--green); color:#0e1116; }
    .subtab[data-s="end"].on { background:var(--amber); border-color:var(--amber); color:#0e1116; }
    .subtab[data-s="act"].on { background:var(--violet); border-color:var(--violet); color:#0e1116; }
    .subtab.on .c { background:rgba(0,0,0,.2); color:#0e1116; }
    .subpanel { display:none; }
    .subpanel.on { display:block; }

    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:15px; align-items:start; }
    .pcard { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; transition:border-color .15s, transform .15s; }
    .pcard:hover { border-color:var(--mute); transform:translateY(-2px); }
    .pcat { padding:8px 13px; display:flex; align-items:center; gap:7px; font-family:'Barlow Condensed',sans-serif; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#0e1116; }
    .pimg { width:100%; height:130px; object-fit:cover; display:block; }
    .pph { height:96px; display:flex; align-items:center; justify-content:center; font-size:30px; opacity:.35; background:var(--surface-2); }
    .pbody { padding:12px 14px 14px; display:flex; flex-direction:column; gap:9px; }
    .ptitle { font-weight:700; font-size:14px; line-height:1.35; color:var(--txt); text-decoration:none; }
    .ptitle:hover { color:var(--violet); }
    .pwhy { font-size:12.5px; color:var(--dim); line-height:1.45; font-style:italic; }
    .pdates-row { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--mute); margin-bottom:4px; }
    .ptrack { height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden; }
    .pfill { height:100%; border-radius:2px; background:var(--violet); }
    .pfill.urgent { background:var(--amber); }
    .purgent { color:var(--amber); font-weight:700; }
    .pprice { font-size:12px; font-weight:700; color:var(--green); display:flex; align-items:center; gap:4px; }
    .pbul { list-style:none; display:flex; flex-direction:column; gap:3px; }
    .pbul li { position:relative; padding-left:13px; font-size:12px; color:var(--dim); line-height:1.4; }
    .pbul li::before { content:'›'; position:absolute; left:0; color:var(--violet); font-weight:700; }

    /* ══ CONCERTS ══════════════════════════════════ */
    .ccard {
      display:flex; gap:14px; background:var(--surface); border:1px solid var(--line);
      border-radius:var(--radius); padding:13px 15px; align-items:center; transition:border-color .15s;
    }
    .ccard:hover { border-color:var(--red); }
    .ccard-img { width:66px; height:66px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--line); }
    .ccard-main { flex:1; min-width:0; }
    .cname { font-weight:700; font-size:15px; color:var(--txt); text-decoration:none; }
    .cname:hover { color:var(--red); }
    .clineup { font-size:12px; color:var(--dim); margin-top:2px; }
    .cmeta { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:6px; align-items:center; }
    .cgenre { font-size:9px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:var(--violet); background:rgba(167,139,250,.12); border-radius:5px; padding:2px 7px; }
    .cvenue { font-size:12px; color:var(--dim); }
    .cnote { font-size:11px; color:var(--amber); font-weight:600; }
    .ccard-date { text-align:right; flex-shrink:0; }
    .ccard-date .d { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--amber); font-weight:600; white-space:nowrap; }
    .ccard-date .p { font-size:11px; color:var(--mute); margin-top:3px; }

    /* ══ SCROLL TOP ══════════════════════════════════ */
    #top {
      position:fixed; right:18px; z-index:200;
      bottom:calc(20px + env(safe-area-inset-bottom,0px));
      width:44px; height:44px; border-radius:50%; border:0; cursor:pointer;
      background:var(--accent); color:#0e1116; font-size:20px; font-weight:900;
      box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
      display:flex; align-items:center; justify-content:center;
    }
    #top.show { opacity:1; pointer-events:auto; }
    #top:active { transform:scale(.92); }

    @media (max-width:600px) {
      .ncard-img { height:170px; }
      .grid { grid-template-columns:1fr 1fr; gap:11px; }
      .pbody { padding:10px 11px 12px; }
      .ptitle { font-size:13px; }
      .ccard-img { width:56px; height:56px; }
      .updated { display:none; }
    }
    @media (max-width:380px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body data-tab="news">

<header class="hdr">
  <div class="hdr-top">
    <span class="wordmark">La Guía Ferlín</span>
    <span class="updated" id="updated"></span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="news"     onclick="switchTab('news')">Noticias <span class="cnt" id="cnt-news">—</span></button>
    <button class="tab"        data-tab="plans"    onclick="switchTab('plans')">Planes <span class="cnt" id="cnt-plans">—</span></button>
    <button class="tab"        data-tab="concerts" onclick="switchTab('concerts')">Conciertos <span class="cnt" id="cnt-concerts">—</span></button>
  </nav>
</header>

<!-- NOTICIAS -->
<section class="panel active" id="tab-news">
  <div class="wrap">
    <div class="lead">
      <div><h1>Noticias</h1><div class="sub" id="news-sub">Lo relevante para ti · IA</div></div>
      <span class="tag" id="news-tag"></span>
    </div>
    <div class="filters" id="news-filters"></div>
    <div id="news-body"><div class="state"><div class="ic">⏳</div><div class="t">Cargando</div></div></div>
  </div>
</section>

<!-- PLANES -->
<section class="panel" id="tab-plans">
  <div class="wrap wrap-wide">
    <div class="lead">
      <div><h1>Planes en Madrid</h1><div class="sub">Ocio · próximas semanas</div></div>
    </div>
    <div class="subtabs">
      <button class="subtab on" data-s="new" onclick="switchPlans('new')">Novedades <span class="c" id="c-new">—</span></button>
      <button class="subtab"    data-s="end" onclick="switchPlans('end')">Acaban pronto <span class="c" id="c-end">—</span></button>
      <button class="subtab"    data-s="act" onclick="switchPlans('act')">Siguen activos <span class="c" id="c-act">—</span></button>
    </div>
    <div class="subpanel on" id="sp-new"><div class="state"><div class="ic">⏳</div><div class="t">Cargando</div></div></div>
    <div class="subpanel"    id="sp-end"></div>
    <div class="subpanel"    id="sp-act"></div>
  </div>
</section>

<!-- CONCIERTOS -->
<section class="panel" id="tab-concerts">
  <div class="wrap">
    <div class="lead">
      <div><h1>Conciertos</h1><div class="sub">Metal &amp; Rock · Madrid</div></div>
      <span class="tag" id="concerts-range"></span>
    </div>
    <div id="concerts-body"><div class="state"><div class="ic">⏳</div><div class="t">Cargando</div></div></div>
  </div>
</section>

<button id="top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Arriba">↑</button>

<script>
/* ── helpers ── */
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const state = (ic,t,s) => `<div class="state"><div class="ic">${ic}</div><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const ES_SRC = ['diario','maldita','europa','robotitus','xataka'];
const isES = src => ES_SRC.some(s => (src||'').toLowerCase().includes(s));

function initials(name,s){
  const w=(name||'').split(/\s+/).filter(x=>/[a-z]/i.test(x[0]||''));
  const i=(w.length>=2?w[0][0]+w[1][0]:(w[0]||'?').slice(0,2)).toUpperCase();
  return `<div class="ccard-img" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute);background:var(--surface-2);font-size:${Math.round(s*.32)}px;">${i}</div>`;
}
window._fb={}; let _fi=0;
function artistImg(url,name){
  if(!url) return initials(name,66);
  const k='fb'+(_fi++); window._fb[k]=initials(name,66);
  return `<img class="ccard-img" src="${esc(url)}" data-fb="${k}" onerror="this.outerHTML=window._fb[this.dataset.fb]||''">`;
}

/* ── scroll top ── */
const topBtn=document.getElementById('top');
addEventListener('scroll',()=>topBtn.classList.toggle('show',scrollY>350),{passive:true});

/* ── tabs ── */
function switchTab(name){
  document.body.dataset.tab=name;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
  scrollTo(0,0);
}
function switchPlans(s){
  document.querySelectorAll('.subpanel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.subtab').forEach(t=>t.classList.remove('on'));
  document.getElementById('sp-'+s).classList.add('on');
  document.querySelector(`.subtab[data-s="${s}"]`).classList.add('on');
}

/* ════ NOTICIAS ════ */
let _news=[], _filter='all';
async function loadNews(){
  try{
    const r=await fetch('./data/news.json?t='+Date.now()); if(!r.ok) throw 0;
    renderNews(await r.json());
  }catch{ document.getElementById('news-body').innerHTML=state('📭','Sin noticias todavía','Aparecerán tras la primera ejecución'); }
}
function renderNews(data){
  const arts=data.articles||[];
  _news=arts;
  document.getElementById('cnt-news').textContent=arts.length;
  document.getElementById('news-tag').textContent=arts.length+' artículos';
  if(data.generated){
    const d=new Date(data.generated);
    document.getElementById('news-sub').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
    document.getElementById('updated').textContent='act. '+d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
  }
  // topic filter chips
  const topics=[...new Set(arts.map(a=>a.topic_label).filter(Boolean))];
  document.getElementById('news-filters').innerHTML = topics.length>1
    ? `<button class="chip on" onclick="setFilter('all',this)">Todo</button>`+
      topics.map(t=>`<button class="chip" onclick="setFilter('${esc(t)}',this)">${esc(t)}</button>`).join('')
    : '';
  paintNews();
}
function setFilter(f,btn){
  _filter=f;
  document.querySelectorAll('#news-filters .chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
  paintNews();
}
function paintNews(){
  const arts=_filter==='all'?_news:_news.filter(a=>a.topic_label===_filter);
  if(!arts.length){ document.getElementById('news-body').innerHTML=state('📰','Sin artículos'); return; }
  document.getElementById('news-body').innerHTML=`<div class="cards">${arts.map(newsCard).join('')}</div>`;
}
function newsCard(a,i){
  // new schema (que_paso/datos/conclusion) with fallback to old (what_happened/key_details/why_it_matters)
  const qp = a.que_paso || a.what_happened || '';
  const datos = Array.isArray(a.datos) ? a.datos : (a.key_details ? [a.key_details] : []);
  const concl = a.conclusion || a.why_it_matters || '';
  const lang = a.language || (isES(a.source)?'es':'en');
  const badge = `<span class="badge badge-${lang==='es'?'es':'en'}">${lang==='es'?'ES':'EN'}</span>`;
  const topic = a.topic_label ? `<span class="topic">${esc(a.topic_label)}</span>` : '';
  const img = a.image ? `<img class="ncard-img" src="${esc(a.image)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  const title = a.url ? `<a class="ncard-title" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : `<span class="ncard-title">${esc(a.title)}</span>`;
  const sQP = qp ? `<div class="sec"><div class="sec-lbl">Qué pasó</div><p>${esc(qp)}</p></div>` : '';
  const sDat = datos.length ? `<div class="sec"><div class="sec-lbl">Datos</div><ul class="datos">${datos.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>` : '';
  const sCon = concl ? `<div class="sec concl"><div class="sec-lbl">Conclusión</div><p>${esc(concl)}</p></div>` : '';
  const link = a.url ? `<a class="ncard-link" href="${esc(a.url)}" target="_blank" rel="noopener">Leer artículo →</a>` : '';
  return `<article class="ncard">${img}<div class="ncard-body">
    <div class="ncard-meta">${topic}${badge}<span class="src">${esc(a.source||'')}</span><span class="src">#${i+1}</span></div>
    ${title}${sQP}${sDat}${sCon}${link}
  </div></article>`;
}

/* ════ PLANES ════ */
const CAT={
  'exposición':['🖼','#6d28d9'],'exposicion':['🖼','#6d28d9'],'museo':['🏛','#0369a1'],
  'teatro':['🎭','#be185d'],'cine':['🎬','#b45309'],'taller':['🔧','#047857'],
  'experiencia':['✨','#0369a1'],'festival':['🎪','#c2410c'],'ruta':['🗺','#166534'],
  'mercado':['🛍','#991b1b'],'gastronomía':['🍽','#b45309'],'gastronomia':['🍽','#b45309'],'evento':['📅','#475569']
};
function parseDate(s){
  if(!s) return null; let m;
  if((m=s.match(/(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3],+m[2]-1,+m[1]);
  const mo={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11,enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11};
  if((m=s.match(/(\d{1,2})\s+(\w+)\s+(\d{4})/))){ const x=mo[m[2].toLowerCase()]; if(x!==undefined) return new Date(+m[3],x,+m[1]); }
  return null;
}
function today0(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
// Effective end date of an event (end if present, else start). Null if none.
function planEndDate(e){ return parseDate(e.date_end_raw||e.date_end||e.date_start_raw||e.date_start); }
function planEnded(e){ const d=planEndDate(e); return d ? d < today0() : false; }
// Always show dates: a start→end row with progress bar when both exist,
// otherwise just the single date. Empty only when no date at all.
function dateBlock(sr,er){
  const s=parseDate(sr), e=parseDate(er), now=today0();
  if(s&&e&&e>s){
    const pct=Math.min(100,Math.max(0,Math.round((now-s)/(e-s)*100)));
    const days=Math.ceil((e-now)/864e5), urg=days>=0&&days<=7;
    const end=urg?`<span class="purgent">⚡ ${days}d</span>`:`<span>${esc(er)}</span>`;
    return `<div><div class="pdates-row"><span>${esc(sr)}</span>${end}</div><div class="ptrack"><div class="pfill${urg?' urgent':''}" style="width:${pct}%"></div></div></div>`;
  }
  if(s) return `<div class="pdates-row"><span>📅 ${esc(sr)}</span></div>`;
  return '';
}
async function loadPlans(){
  try{ const r=await fetch('./data/plans.json?t='+Date.now()); if(!r.ok) throw 0; renderPlans(await r.json()); }
  catch{ document.getElementById('sp-new').innerHTML=state('📭','Sin planes todavía'); }
}
function planCard(e){
  const key=(e.category||'evento').toLowerCase();
  const [em,col]=CAT[key]||['📅','#475569'];
  const img=e.image_url?`<img class="pimg" src="${esc(e.image_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'pph\\'>${em}</div>'">`:`<div class="pph">${em}</div>`;
  const title=e.url?`<a class="ptitle" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:`<span class="ptitle">${esc(e.title)}</span>`;
  const why=e.why_go?`<div class="pwhy">${esc(e.why_go)}</div>`:'';
  const bar=dateBlock(e.date_start_raw||e.date_start,e.date_end_raw||e.date_end);
  const price=e.price?`<div class="pprice">🎟 ${esc(e.price)}</div>`:'';
  const buls=(e.bullets||[]).slice(0,3).map(b=>`<li>${esc(b)}</li>`).join('');
  return `<div class="pcard">
    <div class="pcat" style="background:${col}"><span>${em}</span><span>${esc(e.category||'Evento')}</span></div>
    ${img}
    <div class="pbody">${title}${why}${bar}${price}${buls?`<ul class="pbul">${buls}</ul>`:''}</div>
  </div>`;
}
function renderPlans(d){
  // Drop already-finished events (stopgap until the scraper filters past dates).
  const nw=(d.new||[]).filter(x=>!planEnded(x)),
        en=(d.ending_soon||[]).filter(x=>!planEnded(x)),
        ac=(d.ongoing||[]).filter(x=>!planEnded(x));
  document.getElementById('cnt-plans').textContent=nw.length+en.length+ac.length;
  document.getElementById('c-new').textContent=nw.length;
  document.getElementById('c-end').textContent=en.length;
  document.getElementById('c-act').textContent=ac.length;
  const fill=(id,list,ic,msg)=>document.getElementById(id).innerHTML=list.length?`<div class="grid">${list.map(planCard).join('')}</div>`:state(ic,msg);
  fill('sp-new',nw,'🆕','Sin novedades esta semana');
  fill('sp-end',en,'⏰','Nada termina pronto');
  fill('sp-act',ac,'📭','Sin eventos activos');
}

/* ════ CONCIERTOS ════ */
async function loadConcerts(){
  try{ const r=await fetch('./data/concerts.json?t='+Date.now()); if(!r.ok) throw 0; renderConcerts(await r.json()); }
  catch{ document.getElementById('concerts-body').innerHTML=state('🤘','Sin conciertos todavía'); }
}
function renderConcerts(d){
  const list=d.concerts||[];
  document.getElementById('cnt-concerts').textContent=list.length;
  if(d.from_date&&d.to_date) document.getElementById('concerts-range').textContent=d.from_date+' → '+d.to_date;
  if(!list.length){ document.getElementById('concerts-body').innerHTML=state('🤘','No hay conciertos próximos'); return; }
  const rows=list.map(c=>{
    const name=c.buy_link?`<a class="cname" href="${esc(c.buy_link)}" target="_blank" rel="noopener">${esc(c.artist)}</a>`:`<span class="cname">${esc(c.artist)}</span>`;
    const lineup=(c.lineup&&c.lineup!==c.artist)?`<div class="clineup">${esc(c.lineup)}</div>`:'';
    const genre=c.genre?`<span class="cgenre">${esc(c.genre)}</span>`:'';
    const venue=c.venue?`<span class="cvenue">${esc(c.venue)}</span>`:'';
    const note=c.notes?`<span class="cnote">⚠ ${esc(c.notes)}</span>`:'';
    const price=c.price?`<div class="p">${esc(c.price)}</div>`:'';
    return `<div class="ccard">
      ${artistImg(c.image_url,c.artist)}
      <div class="ccard-main">${name}${lineup}<div class="cmeta">${genre}${venue}${note}</div></div>
      <div class="ccard-date"><div class="d">${esc((c.date_str||'').split('·')[0].trim())}</div>${price}</div>
    </div>`;
  }).join('');
  document.getElementById('concerts-body').innerHTML=`<div class="cards">${rows}</div>`;
}

/* ── init ── */
loadNews(); loadPlans(); loadConcerts();
const h=location.hash.replace('#','');
if(['news','plans','concerts'].includes(h)) switchTab(h);
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
