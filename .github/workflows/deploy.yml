name: Deploy to GitHub Pages

# Replaces the legacy "deploy from a branch" builder, which cannot run
# concurrent deployments and fails with "Deployment failed, try again later"
# when news/plans/concerts push to the repo close together (esp. Mondays).
# A single Actions deployment with a concurrency group serialises deploys
# instead of failing them.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'favicon.ico'
      - 'icons/**'
      - 'splash/**'
      - 'data/**'
  workflow_dispatch:
  workflow_call:   # called by the news/plans/concerts workflows after they commit data

permissions:
  contents: read
  pages: write
  id-token: write

# Serialise every Pages deploy. cancel-in-progress:false means queued
# deploys wait their turn and all complete, so no deploy is ever dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When called via workflow_call from news/plans/concerts (needs: <job>),
          # the inherited ref/sha is the commit that TRIGGERED the caller, i.e.
          # the state BEFORE that job's own "Commit data" push. Without pinning
          # to main explicitly, this deploys stale data one run behind.
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
